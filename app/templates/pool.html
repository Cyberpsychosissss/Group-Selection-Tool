{% extends "base.html" %}
{% block content %}
<div id="live" data-rev="{{ v.rev }}">
  {% include "_pool_body.html" %}
</div>

{# 一对一临时对话：和直接交换位置的人，只能发预设短语；只在服务器内存里保留 15 分钟，不存储 #}
<script type="application/json" id="chat-data">{{ chats|map("list")|list|tojson }}</script>
<aside id="chat" class="chat" hidden>
  <button type="button" class="chat-head" id="chat-toggle"><span id="chat-title">对话</span><span id="chat-unread"></span></button>
  <div class="chat-body">
    <div class="chat-tabs" id="chat-tabs"></div>
    <ul id="chat-log"></ul>
    <div class="chat-say">
      {% for key, label in quick %}<button type="button" data-say="{{ key }}">{{ label }}</button>{% endfor %}
    </div>
    <div class="chat-wx">
      <input id="chat-wx" placeholder="你的微信号" maxlength="32" autocomplete="off">
      <button type="button" data-wx title="微信号只在你和对方的浏览器之间加密传递，服务器只转发密文">加我微信细说</button>
    </div>
    <p class="muted small" id="chat-e2e-hint"></p>
    <p class="muted small">一对一。预设短语明文；微信号端到端加密，服务器只转发密文、不保存。15 分钟后或全部完成后清除。</p>
  </div>
</aside>
{% endblock %}
